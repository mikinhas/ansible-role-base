---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    base_fail2ban_filters:
      - name: molecule-test
        content: |
          [Definition]
          failregex = ^.*authentication failure.*rhost=<HOST>.*$
          ignoreregex =
    base_fail2ban_jails:
      - name: molecule-test
        content: |
          [molecule-test]
          enabled  = true
          port     = http,https
          filter   = molecule-test
          logpath  = /var/log/auth.log
          maxretry = 3
          findtime = 600
          bantime  = 86400
    base_ufw_extra_rules:
      - port: 8080
        proto: tcp
        comment: Port rule
      - interface: dummy0
        direction: in
        comment: Interface rule
      - port: 9090
        proto: tcp
        from_ip: 10.0.0.0/24
        comment: Source-restricted rule
    base_routes:
      eth0:
        - to: 198.51.100.0/24
          via: 10.0.2.2
          metric: 100
  roles:
    - ansible-role-base
