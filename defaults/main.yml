---
# Base packages
base_packages:
  - vim
base_extra_packages: []

# Automatic security updates
base_unattended_upgrades: true
base_unattended_upgrades_autoreboot: false
base_unattended_upgrades_autoreboot_time: "02:00"

# SSH hardening
base_ssh_hardening: true
base_ssh_port: 22
base_ssh_permit_root_login: "yes"
base_ssh_password_authentication: false
base_ssh_max_auth_tries: 3
base_ssh_kex_algorithms:
  - sntrup761x25519-sha512@openssh.com
base_ssh_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
base_ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
base_ssh_host_key_algorithms:
  - ssh-ed25519
  - rsa-sha2-512
  - rsa-sha2-256

# Fail2ban
base_fail2ban: true
base_fail2ban_maxretry: 5
base_fail2ban_findtime: 600
base_fail2ban_bantime: 86400
# Fail2ban filters and jails (e.g. Proxmox web UI)
base_fail2ban_filters: []
# - name: proxmox
#   content: |
#     [Definition]
#     failregex = ...
base_fail2ban_jails: []
# - name: proxmox
#   content: |
#     [proxmox]
#     enabled = true
#     ...

# UFW
base_ufw: true
base_ufw_extra_rules: []
# Port rule, i.e. `ufw allow 80/tcp`
# - port: 80
#   proto: tcp
#   comment: HTTP
# Whole-interface rule, i.e. `ufw allow in on eth1`
# - interface: eth1
#   direction: in
#   comment: Trusted network
# Source-restricted rule, i.e. `ufw allow from 10.0.0.0/24 to any port 5432`
# - port: 5432
#   proto: tcp
#   from_ip: 10.0.0.0/24
#   comment: Database from LAN

# Timezone & NTP
base_timezone: "Europe/Paris"
base_ntp_service: systemd-timesyncd
...
